<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="src/lib/styles/compiled/app.css"/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
	<style>
		:root {
			/*--dark-blue: #5E718C;*/
			--light-blue: #8CA6A2;
			--dark-purple: #0c0711;
			--purple: #482b66;
			--light-purple: #9457d4;
			--lighter-purple: #c590fc;
			--clear-blue: #4EA8DE;
			--dark-gray: #0D0D0D;

			/*for tags*/
			--light-purple-border: 2px solid #9457d4;
			--lighter-purple-border: 2px solid #c590fc;
			--light-blue-border: 2px solid #8CA6A2;
			--clear-blue-border: 2px solid #4EA8DE;

			--device-mins-sm: 600px;
			--device-mins-md: 768px;
			--device-mins-lg: 992px;
			--device-mins-xl: 1200px;

			--device-maxes-xs: var(--device-mins-sm);
			--device-maxes-sm: var(--device-mins-md);
			--device-maxes-md: var(--device-mins-lg);
			--device-maxes-lg: var(--device-mins-xl);

		}

		html {
			scroll-behavior: smooth;
		}

		body {
			margin: 0;
			background-color: var(--dark-purple);
			color: white;
			font-family: Inter;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			max-width: 100vw;
			min-width: 360px;
			min-height: 640px;
			z-index: -1;
		}
	</style>
</html>
